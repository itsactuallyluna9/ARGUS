[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luna", email = "itsactuallyluna9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.5",
    "flask>=3.1.3",
    "flask-cors>=6.0.1",
    "numpy>=2.4.3",
    "ollama>=0.6.1",
    "pandas>=3.0.1",
    "rich>=14.3.3",
]

[project.scripts]
argus = "argus:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
