[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luna", email = "itsactuallyluna9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.5",
    "ddgs>=9.11.4",
    "flask>=3.1.3",
    "flask-cors>=6.0.1",
    "google-genai>=1.68.0",
    "google-search-api",
    "googlesearch-python>=1.3.0",
    "llama-cpp-python[server]>=0.3.19",
    "numpy>=2.4.3",
    "ollama>=0.6.1",
    "openai>=2.30.0",
    "pandas>=3.0.1",
    "pdf-oxide>=0.3.17",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.2",
    "psutil>=7.2.2",
    "pyexcel>=0.7.4",
    "pyexcel-ods3>=0.6.1",
    "pyexcel-xls>=0.7.1",
    "pygooglenews>=0.1.3",
    "python-docx>=1.2.0",
    "rich>=14.3.3",
    "simpleeval>=1.0.7",
    "trafilatura>=2.0.0",
]

[project.scripts]
argus = "argus:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
google-search-api = { git = "https://github.com/abenassi/Google-Search-API" }
